name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Grades the calculator against the owner-signed oracle. Free and offline:
      # no .env, no credentials. Exits non-zero if any figure misses the oracle.
      # The live eval (--live) is billable and must never run here.
      - name: Deterministic eval
        run: npm run eval

      # Builds with no secrets set: verified locally with an empty environment.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
