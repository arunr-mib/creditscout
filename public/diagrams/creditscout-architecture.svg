<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1010" viewBox="0 0 1664 1010" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4A5B76"/>
    </marker>
  </defs>
  <rect width="1664" height="1010" fill="#0A1628"/>
  <text x="64" y="54" fill="#F8FAFC" font-size="26" font-weight="700" letter-spacing="-0.4">CreditScout — system architecture</text>
  <text x="64" y="80" fill="#94A3B8" font-size="14">One orchestrator, six function tools, and a deterministic core the model cannot reach.</text>
  <rect x="1477.4" y="41" width="13" height="13" rx="3" fill="#2B4A6B" stroke="#C3D5E8" stroke-dasharray="3 2.5" stroke-width="1.25"/>
  <text x="1497.4" y="52" fill="#CBD5E1" font-size="12" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">Human approval</text>
  <rect x="1313.2" y="41" width="13" height="13" rx="3" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1333.2" y="52" fill="#CBD5E1" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Deterministic code</text>
  <rect x="1183.5" y="41" width="13" height="13" rx="3" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="1203.5" y="52" fill="#CBD5E1" font-size="12" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">Agent / model</text>
  <rect x="64" y="138" width="20" height="16" rx="2.5" fill="none" stroke="#CBD5E1" stroke-width="1.6"/><line x1="64" y1="143.5" x2="84" y2="143.5" stroke="#CBD5E1" stroke-width="1.6"/><circle cx="67.4" cy="140.9" r="1" fill="#CBD5E1"/>
  <text x="94" y="154" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="-0.2">Analyst</text>
  <text x="64" y="176" fill="#94A3B8" font-size="13" font-weight="500">Browser</text>
  <rect x="238" y="132" width="1362" height="78" rx="7" fill="#2B4A6B" stroke="#C3D5E8" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="919.0" y="162" fill="#FFFFFF" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Onboarding · Credit Analysis Queue · Recommendation · Documents · Covenant terms · Lessons · Governance</text>
  <text x="919.0" y="183" fill="#DCE7F2" font-size="12.5" text-anchor="middle">User sign-in required.</text>
  <text x="919.0" y="200" fill="#DCE7F2" font-size="12.5" text-anchor="middle">The browser can only read what the rules allow it to see. Every change is made by the server, never by the browser.</text>
  <g transform="translate(64,268) scale(0.833333)"><path d="M24 22.525H0l12-21.05 12 21.05z" fill="#FFFFFF"/></g>
  <text x="94" y="284" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="-0.2">Application</text>
  <text x="64" y="306" fill="#94A3B8" font-size="13" font-weight="500">Next.js · Vercel</text>
  <line x1="454" y1="204" x2="454" y2="256" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="238" y="262" width="432" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="454.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">SIGNED-IN ANALYST</text>
  <text x="454.0" y="304" fill="#F8FAFC" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Analyst API + Server Actions</text>
  <text x="454.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">investigate · review · approve terms · propose</text>
  <text x="454.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">session-gated; service-role key stays server-side</text>
  <rect x="688" y="262" width="432" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="904.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">AI ACCESS · SECRET KEY REQUIRED</text>
  <text x="904.0" y="304" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Agent tool routes</text>
  <text x="904.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">Published as OpenAPI; every call must present a secret key.</text>
  <text x="904.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">The agent can reach nothing else — not the database,</text>
  <text x="904.0" y="359" fill="#94A3B8" font-size="12.5" text-anchor="middle">not the analyst's screens.</text>
  <rect x="1138" y="262" width="462" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1369.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">RETRIEVAL INDEX</text>
  <text x="1369.0" y="304" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Ingest + embeddings</text>
  <text x="1369.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">chunk by section, 1536-dim vectors</text>
  <text x="1369.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">text-embedding-3-small</text>
  <text x="1369.0" y="359" fill="#94A3B8" font-size="12.5" text-anchor="middle">Searched by the agent, not pre-loaded — see Agentic RAG below</text>
  <g transform="translate(64,438) scale(0.156250)"><path d="M46.09.002h40.685L44.541 125.137a6.485 6.485 0 01-6.146 4.413H6.733a6.482 6.482 0 01-5.262-2.699 6.474 6.474 0 01-.876-5.848L39.944 4.414A6.488 6.488 0 0146.09 0z" fill="#2E8FDF"/><path d="M97.28 81.607H37.987a2.743 2.743 0 00-1.874 4.751l38.1 35.562a5.991 5.991 0 004.087 1.61h33.574z" fill="#2E8FDF"/><path d="M46.09.002A6.434 6.434 0 0039.93 4.5L.644 120.897a6.469 6.469 0 006.106 8.653h32.48a6.942 6.942 0 005.328-4.531l7.834-23.089 27.985 26.101a6.618 6.618 0 004.165 1.519h36.396l-15.963-45.616-46.533.011L86.922.002z" fill="#2E8FDF"/><path d="M98.055 4.408A6.476 6.476 0 0091.917.002H46.575a6.478 6.478 0 016.137 4.406l39.35 116.594a6.476 6.476 0 01-6.137 8.55h45.344a6.48 6.48 0 006.136-8.55z" fill="#2E8FDF"/></g>
  <text x="94" y="454" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="-0.2">Reasoning</text>
  <text x="64" y="476" fill="#94A3B8" font-size="13" font-weight="500">Azure AI Foundry</text>
  <line x1="454" y1="370" x2="454" y2="426" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="464.0" y="402.0" fill="#94A3B8" font-size="11.5" text-anchor="start">starts a run</text>
  <line x1="904" y1="550" x2="904" y2="376" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="914.0" y="467.0" fill="#94A3B8" font-size="11.5" text-anchor="start">six function tools over HTTPS</text>
  <rect x="238" y="432" width="1362" height="118" rx="7" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="919.0" y="452" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">ORCHESTRATOR · AGENTIC RAG</text>
  <text x="919.0" y="474" fill="#8FD8D1" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">CreditScout Agent — gpt-4.1-mini</text>
  <text x="919.0" y="495" fill="#94A3B8" font-size="12.5" text-anchor="middle">One orchestrator. It chooses what to read next, delegates, re-calculates, and stops when the evidence is enough.</text>
  <text x="919.0" y="512" fill="#94A3B8" font-size="12.5" text-anchor="middle">AGENTIC RAG: it is handed the document INVENTORY — titles, types, dates — and never the text. Every passage it uses,</text>
  <text x="919.0" y="529" fill="#94A3B8" font-size="12.5" text-anchor="middle">it went and retrieved, with a query and a document type it chose. Past lessons are the one exception: those are</text>
  <text x="919.0" y="546" fill="#94A3B8" font-size="12.5" text-anchor="middle">pre-fetched into the brief, and it can search for more.</text>
  <g transform="translate(64,606) scale(0.833333)"><path d="M11.998,24c-0.321,0-0.641-0.084-0.922-0.247l-2.936-1.737c-0.438-0.245-0.224-0.332-0.08-0.383 c0.585-0.203,0.703-0.25,1.328-0.604c0.065-0.037,0.151-0.023,0.218,0.017l2.256,1.339c0.082,0.045,0.197,0.045,0.272,0l8.795-5.076 c0.082-0.047,0.134-0.141,0.134-0.238V6.921c0-0.099-0.053-0.192-0.137-0.242l-8.791-5.072c-0.081-0.047-0.189-0.047-0.271,0 L3.075,6.68C2.99,6.729,2.936,6.825,2.936,6.921v10.15c0,0.097,0.054,0.189,0.139,0.235l2.409,1.392 c1.307,0.654,2.108-0.116,2.108-0.89V7.787c0-0.142,0.114-0.253,0.256-0.253h1.115c0.139,0,0.255,0.112,0.255,0.253v10.021 c0,1.745-0.95,2.745-2.604,2.745c-0.508,0-0.909,0-2.026-0.551L2.28,18.675c-0.57-0.329-0.922-0.945-0.922-1.604V6.921 c0-0.659,0.353-1.275,0.922-1.603l8.795-5.082c0.557-0.315,1.296-0.315,1.848,0l8.794,5.082c0.57,0.329,0.924,0.944,0.924,1.603 v10.15c0,0.659-0.354,1.273-0.924,1.604l-8.794,5.078C12.643,23.916,12.324,24,11.998,24z M19.099,13.993 c0-1.9-1.284-2.406-3.987-2.763c-2.731-0.361-3.009-0.548-3.009-1.187c0-0.528,0.235-1.233,2.258-1.233 c1.807,0,2.473,0.389,2.747,1.607c0.024,0.115,0.129,0.199,0.247,0.199h1.141c0.071,0,0.138-0.031,0.186-0.081 c0.048-0.054,0.074-0.123,0.067-0.196c-0.177-2.098-1.571-3.076-4.388-3.076c-2.508,0-4.004,1.058-4.004,2.833 c0,1.925,1.488,2.457,3.895,2.695c2.88,0.282,3.103,0.703,3.103,1.269c0,0.983-0.789,1.402-2.642,1.402 c-2.327,0-2.839-0.584-3.011-1.742c-0.02-0.124-0.126-0.215-0.253-0.215h-1.137c-0.141,0-0.254,0.112-0.254,0.253 c0,1.482,0.806,3.248,4.655,3.248C17.501,17.007,19.099,15.91,19.099,13.993z" fill="#5FA04E"/></g>
  <text x="94" y="622" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="-0.2">In process</text>
  <text x="64" y="644" fill="#94A3B8" font-size="13" font-weight="500">Same Node process</text>
  <line x1="454" y1="550" x2="454" y2="594" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="464.0" y="576.0" fill="#94A3B8" font-size="11.5" text-anchor="start">delegates</text>
  <rect x="238" y="600" width="648" height="118" rx="7" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="562.0" y="620" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">DELEGATION</text>
  <text x="562.0" y="642" fill="#8FD8D1" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Three specialists — gpt-5-mini</text>
  <text x="562.0" y="663" fill="#94A3B8" font-size="12.5" text-anchor="middle">definition_agent · research_agent · document_agent</text>
  <text x="562.0" y="680" fill="#94A3B8" font-size="12.5" text-anchor="middle">Serviced in-process by lib/agent/specialists.ts.</text>
  <text x="562.0" y="697" fill="#94A3B8" font-size="12.5" text-anchor="middle">facility_id is never a tool parameter — it comes from the casefile.</text>
  <rect x="916" y="600" width="684" height="118" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1258.0" y="620" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">DETERMINISTIC CORE</text>
  <text x="1258.0" y="642" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">calc/dscr.js   ·   guardrails/*.js</text>
  <text x="1258.0" y="663" fill="#94A3B8" font-size="12.5" text-anchor="middle">Zero dependencies, import-free, never a model. The calculator refuses a missing input</text>
  <text x="1258.0" y="680" fill="#94A3B8" font-size="12.5" text-anchor="middle">rather than defaulting it. Six guardrail checks run on every answer; a figure with no logged</text>
  <text x="1258.0" y="697" fill="#94A3B8" font-size="12.5" text-anchor="middle">calculation and no cited quote forces the recommendation to abstain.</text>
  <g transform="translate(64,792) scale(0.833333)"><path d="M11.9 1.036c-.015-.986-1.26-1.41-1.874-.637L.764 12.05C-.33 13.427.65 15.455 2.409 15.455h9.579l.113 7.51c.014.985 1.259 1.408 1.873.636l9.262-11.653c1.093-1.375.113-3.403-1.645-3.403h-9.642z" fill="#3FCF8E"/></g>
  <text x="94" y="808" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="-0.2">Data</text>
  <text x="64" y="830" fill="#94A3B8" font-size="13" font-weight="500">Supabase · cloud only</text>
  <line x1="578" y1="718" x2="578" y2="780" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="1258" y1="718" x2="1258" y2="780" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="238" y="786" width="1362" height="96" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="919.0" y="806" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">ROW-LEVEL SECURITY</text>
  <text x="919.0" y="828" fill="#F8FAFC" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Postgres + pgvector</text>
  <text x="919.0" y="849" fill="#94A3B8" font-size="12.5" text-anchor="middle">facilities · documents · doc_chunks (vector 1536, chunk_index) · covenant_terms (versioned, approved) · tests · exceptions</text>
  <text x="919.0" y="866" fill="#94A3B8" font-size="12.5" text-anchor="middle">casefiles · calc_log · reviews · lessons · policy · eval_runs.  The uploaded FILE is not retained: a document is its indexed sections.</text>
  <line x1="64" y1="920" x2="1600" y2="920" stroke="#2A3A52" stroke-width="1"/>
  <text x="64" y="952" fill="#CBD5E1" font-size="13.5">The boundary that matters: <tspan fill="#5EC2BA">the model never produces a number.</tspan> It decides what to inspect; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">calc/dscr.js</tspan> computes and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">guardrails/*.js</tspan> enforces — both zero-dependency, neither reachable by the model.</text>
  <text x="64" y="984" fill="#5A6B86" font-size="11.5">CreditScout · synthetic data only · the agent recommends, a human decides</text>
</svg>
