<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1178" viewBox="0 0 1664 1178" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8B9BA5"/>
    </marker>
    <marker id="as" markerWidth="8" markerHeight="7" refX="0.5" refY="3.5" orient="auto">
      <path d="M8,0 L0,3.5 L8,7 Z" fill="#8B9BA5"/>
    </marker>
  </defs>
  <rect width="1664" height="1178" fill="#F7F9FA"/>
  <text x="56" y="56" fill="#19282F" font-size="26" font-weight="700" letter-spacing="-0.4">CreditScout architecture</text>
  <text x="56" y="84" fill="#52646D" font-size="14">An analyst-led investigation workflow with agent orchestration, deterministic calculations, and server-enforced controls.</text>
  <rect x="56" y="128" width="360" height="152" rx="16" fill="#EEF2F4" stroke="#C7D3DA" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="74" y="152" fill="#6B7C85" font-size="11.5" font-weight="700" letter-spacing="1.4">EXPERIENCE</text>
  <rect x="526" y="128" width="640" height="480" rx="16" fill="#EDF2F1" stroke="#C7D3DA" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="544" y="152" fill="#6B7C85" font-size="11.5" font-weight="700" letter-spacing="1.4">APPLICATION</text>
  <rect x="1276" y="128" width="332" height="152" rx="16" fill="#E9F0F3" stroke="#C7D3DA" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="1294" y="152" fill="#6B7C85" font-size="11.5" font-weight="700" letter-spacing="1.4">INVESTIGATION</text>
  <rect x="56" y="636" width="1552" height="124" rx="16" fill="#EFF1F2" stroke="#C7D3DA" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="74" y="660" fill="#6B7C85" font-size="11.5" font-weight="700" letter-spacing="1.4">DATA</text>
  <rect x="76" y="162" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="100" cy="186" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="100" y="190.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="122" y="191" fill="#19282F" font-size="15.5" font-weight="700">Analyst workspace</text>
  <text x="96" y="214" fill="#52646D" font-size="12.5">Review exceptions, inspect evidence, approve</text>
  <text x="96" y="231" fill="#52646D" font-size="12.5">covenant terms, and record decisions.</text>
  <rect x="274" y="232" width="104" height="21" rx="10.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1"/>
  <text x="326" y="246.5" fill="#146C67" font-size="10" font-weight="700" letter-spacing="0.3" text-anchor="middle">HUMAN APPROVAL</text>
  <rect x="546" y="162" width="600" height="100" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="570" cy="186" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="570" y="190.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="592" y="191" fill="#19282F" font-size="15.5" font-weight="700">Application services</text>
  <text x="566" y="214" fill="#52646D" font-size="12.5">Onboarding, document processing, covenant tests,</text>
  <text x="566" y="231" fill="#52646D" font-size="12.5">investigations, and analyst reviews.</text>
  <rect x="1296" y="162" width="292" height="100" rx="10" fill="#FFFFFF" stroke="#146C67" stroke-width="1.6"/>
  <circle cx="1320" cy="186" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="1320" y="190.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="1342" y="191" fill="#19282F" font-size="15.5" font-weight="700">Investigation orchestrator</text>
  <text x="1316" y="214" fill="#52646D" font-size="12.5">Selects evidence, requests calculations,</text>
  <text x="1316" y="231" fill="#52646D" font-size="12.5">and delegates research tasks.</text>
  <path d="M396,194 L546,194" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="471" y="184" fill="#6B7C85" font-size="11.5" text-anchor="middle">Starts investigation</text>
  <path d="M546,236 L396,236" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="471" y="256" fill="#6B7C85" font-size="11.5" text-anchor="middle">Records decision</text>
  <path d="M1146,194 L1296,194" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1221" y="184" fill="#6B7C85" font-size="11.5" text-anchor="middle">Starts run</text>
  <path d="M1296,236 L1146,236" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1221" y="256" fill="#6B7C85" font-size="11.5" text-anchor="middle">Returns findings</text>
  <rect x="576" y="330" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#146C67" stroke-width="1.6"/>
  <circle cx="600" cy="354" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="600" y="358.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="622" y="359" fill="#19282F" font-size="15.5" font-weight="700">Specialist services</text>
  <text x="596" y="382" fill="#52646D" font-size="12.5">Covenant interpretation, document review,</text>
  <text x="596" y="399" fill="#52646D" font-size="12.5">targeted research.</text>
  <rect x="896" y="330" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="920" cy="354" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="920" y="358.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text x="942" y="359" fill="#19282F" font-size="15.5" font-weight="700">Tool gateway</text>
  <text x="916" y="382" fill="#52646D" font-size="12.5">Exposes the approved operations available</text>
  <text x="916" y="399" fill="#52646D" font-size="12.5">to the agent.</text>
  <path d="M1442,262 L1442,292 L1036,292 L1036,330" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1200" y="284" fill="#6B7C85" font-size="11.5" text-anchor="middle">Requests evidence · Runs calculation</text>
  <path d="M1340,262 L1340,310 L716,310 L716,330" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="930" y="324" fill="#6B7C85" font-size="11.5" text-anchor="middle">Delegates research task</text>
  <rect x="576" y="470" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="600" cy="494" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="600" y="498.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">7</text>
  <text x="622" y="499" fill="#19282F" font-size="15.5" font-weight="700">Document retrieval</text>
  <text x="596" y="522" fill="#52646D" font-size="12.5">Processes documents into searchable</text>
  <text x="596" y="539" fill="#52646D" font-size="12.5">sections; returns relevant passages.</text>
  <rect x="896" y="470" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="920" cy="494" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="920" y="498.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">6</text>
  <text x="942" y="499" fill="#19282F" font-size="15.5" font-weight="700">Calculation and validation</text>
  <text x="916" y="522" fill="#52646D" font-size="12.5">Computes covenant results from supplied</text>
  <text x="916" y="539" fill="#52646D" font-size="12.5">inputs; validates the answer.</text>
  <path d="M716,422 L716,470" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="676" y="450" fill="#6B7C85" font-size="11.5" text-anchor="middle">In-process</text>
  <path d="M1036,422 L1036,470" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1078" y="450" fill="#6B7C85" font-size="11.5" text-anchor="middle">Calculates</text>
  <path d="M936,422 L936,446 L816,446 L816,470" fill="none" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="876" y="440" fill="#6B7C85" font-size="11.5" text-anchor="middle">Retrieves</text>
  <rect x="76" y="672" width="1512" height="76" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <circle cx="100" cy="696" r="11.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1.2"/>
  <text x="100" y="700.5" fill="#146C67" font-size="12" font-weight="700" text-anchor="middle">8</text>
  <text x="122" y="701" fill="#19282F" font-size="15.5" font-weight="700">Case data and history</text>
  <text x="96" y="724" fill="#52646D" font-size="12.5">Borrower records, document sections, versioned covenant terms, tests, investigations, calculations, decisions, lessons, evaluations.</text>
  <path d="M566,262 L566,286 L466,286 L466,672" fill="none" stroke="#B3C0C8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="500" y="470" fill="#6B7C85" font-size="11.5" text-anchor="middle">Reads · writes</text>
  <path d="M716,570 L716,672" fill="none" stroke="#B3C0C8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M1036,570 L1036,672" fill="none" stroke="#B3C0C8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="1040" y1="54" x2="1066" y2="54" stroke="#8B9BA5" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1074" y="58" fill="#52646D" font-size="12">Request / response</text>
  <line x1="1200" y1="54" x2="1226" y2="54" stroke="#B3C0C8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="1234" y="58" fill="#52646D" font-size="12">Data access</text>
  <rect x="1332" y="44" width="104" height="21" rx="10.5" fill="#E8F2F1" stroke="#146C67" stroke-width="1"/>
  <text x="1384" y="58.5" fill="#146C67" font-size="10" font-weight="700" letter-spacing="0.3" text-anchor="middle">HUMAN APPROVAL</text>
  <text x="1446" y="58" fill="#52646D" font-size="12">Decision point</text>
  <line x1="56" y1="788" x2="1608" y2="788" stroke="#C7D3DA" stroke-width="1"/>
  <text x="56" y="812" fill="#19282F" font-size="14" font-weight="700">Notes</text>
  <text x="56" y="836" fill="#146C67" font-size="12" font-weight="700">1</text>
  <text x="74" y="836" fill="#52646D" font-size="12.3">Authenticated access. Server-side authorization controls what each</text>
  <text x="74" y="852" fill="#52646D" font-size="12.3">request may read and change.</text>
  <text x="56" y="878" fill="#146C67" font-size="12" font-weight="700">2</text>
  <text x="74" y="878" fill="#52646D" font-size="12.3">Services the agent's specialist calls in-process: those have no HTTP</text>
  <text x="74" y="894" fill="#52646D" font-size="12.3">route. Quarterly covenant tests call the calculation service directly,</text>
  <text x="74" y="910" fill="#52646D" font-size="12.3">with no agent involved.</text>
  <text x="56" y="936" fill="#146C67" font-size="12" font-weight="700">3</text>
  <text x="74" y="936" fill="#52646D" font-size="12.3">Starts from the document inventory — titles, types and dates — and</text>
  <text x="74" y="952" fill="#52646D" font-size="12.3">retrieves source passages as needed. Relevant prior lessons are</text>
  <text x="74" y="968" fill="#52646D" font-size="12.3">supplied as additional context.</text>
  <text x="56" y="994" fill="#146C67" font-size="12" font-weight="700">4</text>
  <text x="74" y="994" fill="#52646D" font-size="12.3">Operate within the investigation's case scope. The borrower and the</text>
  <text x="74" y="1010" fill="#52646D" font-size="12.3">period come from the casefile, not from the agent's arguments.</text>
  <text x="852" y="836" fill="#146C67" font-size="12" font-weight="700">5</text>
  <text x="870" y="836" fill="#52646D" font-size="12.3">Requests are authenticated and scoped to the active case.</text>
  <text x="870" y="852" fill="#52646D" font-size="12.3">The agent has no direct database access.</text>
  <text x="852" y="878" fill="#146C67" font-size="12" font-weight="700">6</text>
  <text x="870" y="878" fill="#52646D" font-size="12.3">Missing required inputs return an explicit error rather than a</text>
  <text x="870" y="894" fill="#52646D" font-size="12.3">default. The agent can request a calculation and supply its inputs;</text>
  <text x="870" y="910" fill="#52646D" font-size="12.3">it cannot change the calculation logic or the validation rules.</text>
  <text x="852" y="936" fill="#146C67" font-size="12" font-weight="700">7</text>
  <text x="870" y="936" fill="#52646D" font-size="12.3">Sections are embedded once at upload and searched per request.</text>
  <text x="870" y="952" fill="#52646D" font-size="12.3">Original uploads are not retained: a document is its indexed</text>
  <text x="870" y="968" fill="#52646D" font-size="12.3">sections, and every citation resolves to one of them.</text>
  <text x="852" y="994" fill="#146C67" font-size="12" font-weight="700">8</text>
  <text x="870" y="994" fill="#52646D" font-size="12.3">Row-level security applies to every read. Covenant terms are</text>
  <text x="870" y="1010" fill="#52646D" font-size="12.3">versioned and effective-dated; an amendment supersedes.</text>
  <rect x="56" y="1038" width="1552" height="58" rx="10" fill="#FFFFFF" stroke="#C7D3DA" stroke-width="1.2"/>
  <text x="76" y="1060" fill="#6B7C85" font-size="11" font-weight="700" letter-spacing="1.3">IMPLEMENTATION DETAILS</text>
  <text x="76" y="1081" fill="#52646D" font-size="12.3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Next.js on Vercel  ·  Azure AI Foundry, gpt-4.1-mini orchestrator  ·  gpt-5-mini specialists  ·  text-embedding-3-small, 1536 dimensions  ·  calc/dscr.js  ·  guardrails/*.js  ·  Postgres + pgvector</text>
  <text x="56" y="1130" fill="#19282F" font-size="14.5" font-weight="700">Control summary</text>
  <text x="56" y="1154" fill="#52646D" font-size="13.5">The agent directs the investigation. Application code calculates and validates the result. An analyst records the decision.</text>
</svg>
