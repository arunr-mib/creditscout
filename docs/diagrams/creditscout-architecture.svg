<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1010" viewBox="0 0 1664 1010" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#4A5B76"/>
    </marker>
  </defs>
  <rect width="1664" height="1010" fill="#0A1628"/>
  <text x="64" y="54" fill="#F8FAFC" font-size="26" font-weight="700" letter-spacing="-0.4">CreditScout — system architecture</text>
  <text x="64" y="80" fill="#94A3B8" font-size="14">One orchestrator, six function tools, and a deterministic core the model cannot reach.</text>
  <rect x="1477.4" y="41" width="13" height="13" rx="3" fill="#11243D" stroke="#94A3B8" stroke-dasharray="3 2.5" stroke-width="1.25"/>
  <text x="1497.4" y="52" fill="#CBD5E1" font-size="12" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">Human approval</text>
  <rect x="1313.2" y="41" width="13" height="13" rx="3" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1333.2" y="52" fill="#CBD5E1" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Deterministic code</text>
  <rect x="1183.5" y="41" width="13" height="13" rx="3" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="1203.5" y="52" fill="#CBD5E1" font-size="12" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">Agent / model</text>
  <text x="64" y="154" fill="#CBD5E1" font-size="13" font-weight="600">Analyst</text>
  <text x="64" y="173" fill="#5A6B86" font-size="11.5">browser</text>
  <rect x="238" y="132" width="1362" height="72" rx="7" fill="#11243D" stroke="#94A3B8" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="919.0" y="162" fill="#F8FAFC" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Credit Analysis Queue · Casefile · Onboarding · Documents · Covenant terms · Lessons · Governance</text>
  <text x="919.0" y="183" fill="#94A3B8" font-size="12.5" text-anchor="middle">Server-rendered behind a session gate. Reads use the anon key under RLS; every write goes through a Server Action or a key-gated route.</text>
  <text x="64" y="284" fill="#CBD5E1" font-size="13" font-weight="600">Application</text>
  <text x="64" y="303" fill="#5A6B86" font-size="11.5">Next.js on Vercel</text>
  <line x1="454" y1="204" x2="454" y2="256" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="238" y="262" width="432" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="454.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">SIGNED-IN ANALYST</text>
  <text x="454.0" y="304" fill="#F8FAFC" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Analyst API + Server Actions</text>
  <text x="454.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">investigate · review · approve terms · propose</text>
  <text x="454.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">session-gated; service-role key stays server-side</text>
  <rect x="688" y="262" width="432" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="904.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">KEY-GATED</text>
  <text x="904.0" y="304" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Agent tool routes</text>
  <text x="904.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">OpenAPI 3.0 · CREDITSCOUT_TOOL_KEY</text>
  <text x="904.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">the only surface the agent can reach</text>
  <rect x="1138" y="262" width="462" height="108" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1369.0" y="282" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">PIPELINE</text>
  <text x="1369.0" y="304" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Ingest + embeddings</text>
  <text x="1369.0" y="325" fill="#94A3B8" font-size="12.5" text-anchor="middle">chunk by section, 1536-dim vectors</text>
  <text x="1369.0" y="342" fill="#94A3B8" font-size="12.5" text-anchor="middle">text-embedding-3-small</text>
  <text x="64" y="454" fill="#CBD5E1" font-size="13" font-weight="600">Reasoning</text>
  <text x="64" y="473" fill="#5A6B86" font-size="11.5">Azure AI Foundry</text>
  <line x1="454" y1="370" x2="454" y2="426" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="464.0" y="402.0" fill="#94A3B8" font-size="11.5" text-anchor="start">starts a run</text>
  <line x1="904" y1="536" x2="904" y2="376" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="914.0" y="460.0" fill="#94A3B8" font-size="11.5" text-anchor="start">six function tools over HTTPS</text>
  <rect x="238" y="432" width="1362" height="104" rx="7" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="919.0" y="452" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">ORCHESTRATOR</text>
  <text x="919.0" y="474" fill="#8FD8D1" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">CreditScout Agent — gpt-4.1-mini</text>
  <text x="919.0" y="495" fill="#94A3B8" font-size="12.5" text-anchor="middle">One orchestrator. It chooses what to read next, delegates, re-calculates, and stops when the evidence is enough.</text>
  <text x="919.0" y="512" fill="#94A3B8" font-size="12.5" text-anchor="middle">Connected Agents was dropped 2026-10-06: a connected agent cannot carry a function tool, so specialists could not retrieve.</text>
  <text x="64" y="622" fill="#CBD5E1" font-size="13" font-weight="600">In process</text>
  <text x="64" y="641" fill="#5A6B86" font-size="11.5">same Node process</text>
  <line x1="454" y1="536" x2="454" y2="594" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="464.0" y="569.0" fill="#94A3B8" font-size="11.5" text-anchor="start">delegates</text>
  <rect x="238" y="600" width="648" height="118" rx="7" fill="#10302E" stroke="#5EC2BA" stroke-width="1.25"/>
  <text x="562.0" y="620" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">DELEGATION</text>
  <text x="562.0" y="642" fill="#8FD8D1" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Three specialists — gpt-5-mini</text>
  <text x="562.0" y="663" fill="#94A3B8" font-size="12.5" text-anchor="middle">definition_agent · research_agent · document_agent</text>
  <text x="562.0" y="680" fill="#94A3B8" font-size="12.5" text-anchor="middle">Serviced in-process by lib/agent/specialists.ts.</text>
  <text x="562.0" y="697" fill="#94A3B8" font-size="12.5" text-anchor="middle">facility_id is never a tool parameter — it comes from the casefile.</text>
  <rect x="916" y="600" width="684" height="118" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="1258.0" y="620" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">DETERMINISTIC CORE</text>
  <text x="1258.0" y="642" fill="#F8FAFC" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">calc/dscr.js   ·   guardrails/*.js</text>
  <text x="1258.0" y="663" fill="#94A3B8" font-size="12.5" text-anchor="middle">Zero dependencies, import-free, never a model. The calculator refuses a missing input</text>
  <text x="1258.0" y="680" fill="#94A3B8" font-size="12.5" text-anchor="middle">rather than defaulting it. Six guardrail checks run on every answer; a figure with no logged</text>
  <text x="1258.0" y="697" fill="#94A3B8" font-size="12.5" text-anchor="middle">calculation and no cited quote forces the recommendation to abstain.</text>
  <text x="64" y="808" fill="#CBD5E1" font-size="13" font-weight="600">Data</text>
  <text x="64" y="827" fill="#5A6B86" font-size="11.5">Supabase · cloud only</text>
  <line x1="578" y1="718" x2="578" y2="780" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="1258" y1="718" x2="1258" y2="780" stroke="#4A5B76" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="238" y="786" width="1362" height="96" rx="7" fill="#11243D" stroke="#2A3A52" stroke-width="1.25"/>
  <text x="919.0" y="806" fill="#94A3B8" font-size="10.5" letter-spacing="1.3" text-anchor="middle">ROW-LEVEL SECURITY</text>
  <text x="919.0" y="828" fill="#F8FAFC" font-size="15" font-weight="600" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">Postgres + pgvector</text>
  <text x="919.0" y="849" fill="#94A3B8" font-size="12.5" text-anchor="middle">facilities · documents · doc_chunks (vector 1536, chunk_index) · covenant_terms (versioned, approved) · tests · exceptions</text>
  <text x="919.0" y="866" fill="#94A3B8" font-size="12.5" text-anchor="middle">casefiles · calc_log · reviews · lessons · policy · eval_runs.  The uploaded FILE is not retained: a document is its indexed sections.</text>
  <line x1="64" y1="920" x2="1600" y2="920" stroke="#2A3A52" stroke-width="1"/>
  <text x="64" y="952" fill="#CBD5E1" font-size="13.5">The boundary that matters: <tspan fill="#5EC2BA">the model never produces a number.</tspan> It decides what to inspect; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">calc/dscr.js</tspan> computes and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">guardrails/*.js</tspan> enforces — both zero-dependency, neither reachable by the model.</text>
  <text x="64" y="984" fill="#5A6B86" font-size="11.5">CreditScout · synthetic data only · the agent recommends, a human decides</text>
</svg>
